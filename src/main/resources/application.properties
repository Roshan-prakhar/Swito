spring.application.name=foodiesapi

#postgresql configuration for production
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#cloudflare r2 configuration
cloudflare.access.key=${CLOUDFLARE_ACCESS_KEY}
cloudflare.secret.key=${CLOUDFLARE_SECRET_KEY}
cloudflare.endpoint=${CLOUDFLARE_R2_ENDPOINT}
cloudflare.bucketname=${CLOUDFLARE_BUCKET_NAME}

jwt.secret.key=${JWT_SECRET}